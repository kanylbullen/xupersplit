name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN — this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Inlined rather than read from secrets, so that pull requests from forks
      # can run too: GitHub withholds both secrets and configuration variables
      # from fork-triggered runs, which left the server unable to boot and every
      # smoke test timing out. These two are publishable credentials — they ship
      # in the client bundle on every page of split.xuper.fun, and security rests
      # on RLS plus the RPC layer, not on hiding them. See .env.example.
      NEXT_PUBLIC_SUPABASE_URL: https://uvlgfszbmzdurjlbqovu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IuQPAVuL6w-uQLuVtXZLyQ_Ka_tDBr4
      # Stays a secret: it is a capability link to the smoke split. Fork runs get
      # an empty value and the tests that need it skip themselves (smoke.spec.ts).
      SMOKE_SPLIT_KEY: ${{ secrets.SMOKE_SPLIT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the build, so a lint failure costs seconds rather than minutes.
      # Existing violations are recorded in eslint-suppressions.json and pass;
      # anything new fails. Warnings stay advisory and don't gate.
      - name: Lint
        run: npm run lint

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
